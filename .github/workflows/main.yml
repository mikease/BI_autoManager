name: BiliBili Daily Task

on:
  workflow_dispatch: # 手动触发运行
  schedule:
    - cron: '0 1 * * *' # 每天北京时间 09:00 (UTC 01:00) 自动运行

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          PYTHONUNBUFFERED: "1"
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
          BILI_USERID: ${{ secrets.BILI_USERID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python test3.py

      - name: Monthly Keepalive (Prevent 60-day GitHub sleep)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. 提交月度运维健康巡检档案（如发生变动）
          if [ -f ".github/ops-status.json" ]; then
            git add .github/ops-status.json
          fi
          
          # 2. 检查距离上次提交的天数，超过 40 天或每月 1 号自动刷新保活记录
          LAST_COMMIT_TIME=$(git log -1 --format=%ct)
          CURRENT_TIME=$(date +%s)
          DAYS_SINCE=$(( (CURRENT_TIME - LAST_COMMIT_TIME) / 86400 ))
          echo "距上次提交已过去: ${DAYS_SINCE} 天"
          
          if [ ${DAYS_SINCE} -ge 40 ] || [ $(date +%d) -eq 01 ] || [ ! -f ".keepalive" ]; then
            echo "触发自动保活机制，生成月度活跃标记..."
            date -u +"%Y-%m-%d %H:%M:%S UTC" > .keepalive
            git add .keepalive
          fi
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(ops): monthly automated maintenance & keepalive [skip ci]"
            git push origin main
            echo "已成功提交月度运维与保活记录，GitHub 60天定时任务倒计时已重置！"
          else
            echo "本周期档案无变更且未达保活阈值，跳过提交。"
          fi
